services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vtpeerpulse
      POSTGRES_PASSWORD: vtpeerpulse
      POSTGRES_DB: vtpeerpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtpeerpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://vtpeerpulse:vtpeerpulse@db:5432/vtpeerpulse
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://vtpeerpulse:vtpeerpulse@db:5432/vtpeerpulse
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your environment}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-vt.edu}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
