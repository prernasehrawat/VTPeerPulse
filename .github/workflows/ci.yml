name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vtpeerpulse
          POSTGRES_PASSWORD: vtpeerpulse
          POSTGRES_DB: vtpeerpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtpeerpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vtpeerpulse:vtpeerpulse@localhost:5432/vtpeerpulse_test
      AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      APP_BASE_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate test database
        run: npx prisma migrate deploy
      - name: Unit & integration tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vtpeerpulse
          POSTGRES_PASSWORD: vtpeerpulse
          POSTGRES_DB: vtpeerpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtpeerpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vtpeerpulse:vtpeerpulse@localhost:5432/vtpeerpulse
      AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      APP_BASE_URL: http://localhost:3000
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
