# Production topology: app + Postgres + nightly backups.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Required environment (use a secrets manager or an untracked .env file):
#   POSTGRES_PASSWORD, AUTH_SECRET (32+ chars), APP_BASE_URL, NEXTAUTH_URL,
#   EMAIL_PROVIDER/EMAIL_API_KEY/EMAIL_FROM, and optionally AI_* / OIDC_*.
#
# TLS is expected to terminate at a reverse proxy (Caddy/nginx/university LB)
# in front of port 3000 — do not expose this service directly.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtpeerpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vtpeerpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtpeerpulse"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://vtpeerpulse:${POSTGRES_PASSWORD}@db:5432/vtpeerpulse
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vtpeerpulse:${POSTGRES_PASSWORD}@db:5432/vtpeerpulse
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (32+ chars)}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL to the public https URL}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL to the public https URL}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-vt.edu}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-VT PeerPulse <no-reply@example.edu>}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_API_URL: ${EMAIL_API_URL:-https://api.resend.com/emails}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-University SSO}
      SCHEDULER_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nightly logical backups with 14-day retention. Restore drill: scripts/restore.sh
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h db -U vtpeerpulse -Fc vtpeerpulse > "/backups/vtpeerpulse-$$ts.dump" \
            && echo "backup ok: vtpeerpulse-$$ts.dump" \
            || echo "backup FAILED at $$ts" >&2
          ls -1t /backups/vtpeerpulse-*.dump 2>/dev/null | tail -n +15 | xargs -r rm --
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
